<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>History Section</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f7f7f7;
            padding: 20px;
        }

        h1{
            text-align: center;
            text-transform: uppercase;
            color: #2c3e50;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background-color: #fff;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        th,
        td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: center;
        }

        thead {
            background-color: #34495e;
            color: white;
        }

        tbody tr:nth-child(odd) {
            background-color: #f2f2f2;
        }
        tbody tr:hover {
            background-color: #eef6ff;
        }

        .winner {
            font-weight: bold;
            color: #27ae60;
        }

        .hotm {
            background-color: #ffeaa7;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Histoty Section - House of the month</h1>

    <table>
        <thead>
            <tr>
                <th>Month</th>
                <th>Campus</th>
                <th>Winning House </th>
                <th>Academic</th>
                <th>Cultural</th>
                <th>Total Score</th>
                <th>Tag</th>
            </tr>
        </thead>

        <tbody>
            <tr class="hotm">
                <td>April 2025</td>
                <td>Jashpur</td>
                <td class="winner">Malhar House</td>
                <td>88</td>
                <td>90</td>
                <td>178</td>
                <td> House of the Month</td>
            </tr>

            <tr>
                <td>March 2025</td>
                <td>Dharamshala</td>
                <td class="winner">Bageshri House</td>
                <td>85</td>
                <td>80</td>
                <td>165</td>
                <td> Winner</td>
            </tr>

            <tr>
                <td>February 2025</td>
                <td>Bangalore</td>
                <td class="winner">Bhairav House</td>
                <td>75</td>
                <td>85</td>
                <td>160</td>
                <td> Winner</td>
            </tr>
        </tbody>
    </table>
</body>

</html>
