<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top House</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #333;
            text-transform: uppercase;
        }

        table {
            width: 100%;
            border-color:black;
            border-collapse: collapse;
            background-color: #fff;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        thead {
            background-color: #333;
            color: #fff;
        }

        th,
        td {
            padding: 12px;
            text-align: center;
            border: 1px solid #ddd;
        }

        tbody tr:nth-child(odd) {
            background-color: #f9f9f9;
        }

        tbody tr:hover {
            background-color: #eef6ff;
        }

        td:nth-child(1) {
            font-size: 1.5em;
        }

        .gold {
            color: gold;
            font-weight: bold;
        }
        .silver {
            color: silver;
            font-weight: bold;
        }
        .bronze {
            color: #cd7f32;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <h1>🏅 Top Houses 🔥</h1>
    <table>
        <thead>
            <tr>
                <th>Rank</th>
                <th>House</th>
                <th>Sessions</th>
                <th>Placements</th>
                <th>Programs</th>
                <th>Dropouts</th>
                <th>Highlights 🔥</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td class="gold">🥇</td>
                <td><strong>Malhar House</strong></td>
                <td>320</td>
                <td>45</td>
                <td>28</td>
                <td>1</td>
                <td>Most consistent performance 💪</td>
            </tr>

            <tr>
                <td class="Silver">🥈</td>
                <td><strong>Bageshri House</strong></td>
                <td>310</td>
                <td>40</td>
                <td>30</td>
                <td>2</td>
                <td>Highest program completion ✅</td>
            </tr>

            <tr>
                <td class="Bronze">🥉</td>
                <td><strong>Bhairav House</strong></td>
                <td>295</td>
                <td>38</td>
                <td>26</td>
                <td>0</td>
                <td>Zero dropout rate 🚀</td>
            </tr>
        </tbody>
    </table>
</body>

</html>
